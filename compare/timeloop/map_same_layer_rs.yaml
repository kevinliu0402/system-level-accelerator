# Row-stationary (Eyeriss-style) for same layer: reuse row of filter * row of input
mapping:
  - target: MainMemory
    type: temporal
    factors: [N=1, M=64, C=64, R=1, S=1, P=56, Q=56]
    permutation: [N, C, R, S, M, P, Q]
  - target: Buffer
    type: temporal
    factors: [N=1, M=1, C=1, R=3, S=3, P=1, Q=1]
    permutation: [R, S, C, N, M, P, Q]
