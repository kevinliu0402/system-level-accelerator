# Same layer as MAESTRO: N=1, M=C=64, R=S=3, P=Q=56 -> 107,495,424 MACs
problem:
  version: 0.4
  instance:
    N: 1
    C: 64
    M: 64
    R: 3
    S: 3
    P: 56
    Q: 56
    Wstride: 1
    Hstride: 1
    Wdilation: 1
    Hdilation: 1
  shape:
    name: CNN_Layer
    dimensions: [C, M, R, S, N, P, Q]
    data_spaces:
      - name: Weights
        projection:
          - - - C
          - - - M
          - - - R
          - - - S
        read_write: false
      - name: Inputs
        projection:
          - - - N
          - - - C
          - - - R
              - Wdilation
            - - P
              - Wstride
          - - - S
              - Hdilation
            - - Q
              - Hstride
        read_write: false
      - name: Outputs
        projection:
          - - - N
          - - - M
          - - - Q
          - - - P
        read_write: true
    coefficients:
      - name: Wstride
        default: 1
      - name: Hstride
        default: 1
      - name: Wdilation
        default: 1
      - name: Hdilation
        default: 1
